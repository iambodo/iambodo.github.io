---
layout: default
---
<article class="post-article">
  <header class="post-header">
    {% if page.category %}
      <p class="post-meta"><span class="post-tag">{{ page.category }}</span></p>
    {% endif %}
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}
      <p class="post-desc">{{ page.description }}</p>
    {% endif %}
  </header>
  {% if page.img %}
    <img src="{{ page.img | relative_url }}" alt="{{ page.title }}" class="project-img">
  {% endif %}
  <div class="post-content md-body">
    {{ content }}
  </div>
</article>
