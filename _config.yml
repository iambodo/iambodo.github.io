# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------
title: iambodo
first_name: Bodo
last_name: Lang
description: DHIS2 implementation adviser, data scientist, and public health researcher.

url: https://iambodo.github.io
baseurl: ""

github_username: iambodo

# -----------------------------------------------------------------------------
# Jekyll — no remote_theme, plain Jekyll with custom layouts
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:title/

kramdown:
  input: GFM

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project

# -----------------------------------------------------------------------------
# Plugins — minimal set, all GitHub Pages compatible
# -----------------------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

paginate: 10
paginate_path: /blog/page:num/

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - index-preview.html
