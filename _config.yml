# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------
title: iambodo
first_name: Bodo
last_name: Lang
email: # your email
description: DHIS2 implementation adviser, data scientist, and public health researcher.

url: https://iambodo.github.io
baseurl: ""

# Social links
github_username: iambodo
linkedin_username: # your LinkedIn handle

# Open Graph / SEO
og_image: assets/img/profile.jpg

# -----------------------------------------------------------------------------
# Theme — loaded remotely, no gem install needed
# -----------------------------------------------------------------------------
remote_theme: alshedivat/al-folio

# -----------------------------------------------------------------------------
# Jekyll
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:title/

kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  news:
    output: false
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
  - scope:
      path: ""
      type: projects
    values:
      layout: page

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate-v2
  - jekyll-seo-tag
  - jekyll-email-protect
  - jekyll-link-attributes
  - jemoji

# Pagination
pagination:
  enabled: true
  per_page: 10
  permalink: /page/:num/
  sort_reverse: true

# -----------------------------------------------------------------------------
# al-folio appearance
# -----------------------------------------------------------------------------
enable_darkmode: false
enable_navbar_social: true
enable_project_categories: true
enable_medium_zoom: true

# Footer
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with
  <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
